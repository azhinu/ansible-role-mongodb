---
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: true
platforms:
  - name: dev-test-mongo
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.ansible/collections
    ANSIBLE_VAULT_PASSWORD_FILE: ${ANSIBLE_VAULT_PASSWORD_FILE:-/run/vault-pass}
    ANSIBLE_INJECT_FACT_VARS: 'false'
  config_options:
    defaults:
      inject_facts_as_vars: false
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    links:
      hosts: ${MOLECULE_PROJECT_DIRECTORY}/../../inventory/dev_test_inv.yml
      host_vars: host_vars
      group_vars: group_vars
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - syntax
    - converge
    - idempotence
    - verify
    - destroy
