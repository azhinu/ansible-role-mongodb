---
- name: Create a fresh Docker target
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create MongoDB bootstrap container
      community.docker.docker_container:
        name: mongodb-molecule-bootstrap
        hostname: mongodb-molecule-bootstrap
        image: "{{ lookup('ansible.builtin.env', 'MONGODB_MOLECULE_IMAGE', default='chargers-ansible-test:ubuntu24') }}"
        command: /sbin/init
        privileged: true
        cgroupns_mode: private
        tmpfs: [/run, /run/lock]
        networks:
          - name: "{{ lookup('ansible.builtin.env', 'MONGODB_MOLECULE_NETWORK', default='chargers-dev-test_downloads') }}"
        state: started
        container_default_behavior: no_defaults
