---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, python3-debian, python3-pymongo]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable transparent huge pages
  ansible.builtin.include_tasks: disable_transparent_hugepages.yml
  when: mongodb_disable_transparent_hugepages | bool

- name: Install MongoDB signing key
  ansible.builtin.get_url:
    url: "https://pgp.mongodb.com/server-{{ mongodb_major_version }}.asc"
    dest: "/usr/share/keyrings/mongodb-server-{{ mongodb_major_version }}.asc"
    mode: "0644"
  when: mongodb_package == 'mongodb-org'

- name: Remove legacy MongoDB repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/repo_mongodb_org_apt_ubuntu.list
    - /etc/apt/sources.list.d/repo_mongodb_org_apt_debian.list
    - /etc/apt/sources.list.d/mongodb-org.list
  when: mongodb_package == 'mongodb-org'

- name: Configure MongoDB APT repository
  ansible.builtin.deb822_repository:
    name: mongodb-org
    types: [deb]
    uris: "https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }}"
    suites:
      - "{{ 'focal' if not mongodb_version_supported | bool else ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_major_version }}"
    components: "{{ ['multiverse'] if ansible_facts['distribution'] == 'Ubuntu' else ['main'] }}"
    signed_by: "/usr/share/keyrings/mongodb-server-{{ mongodb_major_version }}.asc"
    mode: "0644"
  when: mongodb_package == 'mongodb-org'
  notify: MongoDB refresh APT cache

- name: Apply repository changes before installing MongoDB
  ansible.builtin.meta: flush_handlers

- name: Install legacy OpenSSL for MongoDB 4.4 on newer Ubuntu
  when:
    - not mongodb_version_supported | bool
    - ansible_facts['distribution'] == 'Ubuntu'
  block:
    - name: Inspect legacy OpenSSL installation
      ansible.builtin.package_facts:
        manager: auto

    - name: Install compatibility dependency from Focal security
      when: "'libssl1.1' not in ansible_facts['packages']"
      block:
        - name: Temporarily enable Focal security for libssl1.1
          ansible.builtin.deb822_repository:
            name: mongodb-libssl-compat
            types: [deb]
            uris: http://security.ubuntu.com/ubuntu
            suites: [focal-security]
            components: [main]
            signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
            mode: "0644"
          changed_when: false

        - name: Install libssl1.1
          ansible.builtin.apt:
            name: libssl1.1
            state: present
            update_cache: true
      always:
        - name: Remove temporary Focal security repository
          ansible.builtin.deb822_repository:
            name: mongodb-libssl-compat
            state: absent
          changed_when: false

- name: Install MongoDB packages
  ansible.builtin.apt:
    name: >-
      {{ [mongodb_package] if mongodb_version.split('.') | length == 2 else
         [mongodb_package + '=' + mongodb_version,
          'mongodb-org-server=' + mongodb_version,
          'mongodb-org-shell=' + mongodb_version,
          'mongodb-org-mongos=' + mongodb_version,
          'mongodb-org-tools=' + mongodb_version] }}
    state: "{{ mongodb_package_state }}"
    policy_rc_d: 101

- name: Install NUMA tools
  ansible.builtin.apt:
    name: numactl
    state: present
  when: mongodb_use_numa | bool

- name: Install MongoDB systemd unit
  ansible.builtin.template:
    src: mongodb.service.j2
    dest: "/etc/systemd/system/{{ mongodb_daemon_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - mongodb_manage_systemd_unit | bool
  notify:
    - MongoDB reload systemd
    - MongoDB restart
