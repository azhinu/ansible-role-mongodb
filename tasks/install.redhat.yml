---
- name: Configure MongoDB RPM repository
  ansible.builtin.yum_repository:
    name: mongodb-org
    description: MongoDB repository
    baseurl: "{{ mongodb_repository[mongodb_major_version] }}"
    gpgkey: "{{ mongodb_repository_gpgkey[mongodb_major_version] }}"
    gpgcheck: true
    enabled: true
  when: mongodb_package == 'mongodb-org'

- name: Install MongoDB and Python driver
  ansible.builtin.dnf:
    name:
      - "{{ mongodb_package + ('-' + mongodb_version if mongodb_version.split('.') | length > 2 else '') }}"
      - python3-pymongo
    state: "{{ mongodb_package_state }}"
    lock_timeout: 180

- name: Install NUMA tools
  ansible.builtin.dnf:
    name: numactl
    state: present
  when: mongodb_use_numa | bool

- name: Install MongoDB systemd unit
  ansible.builtin.template:
    src: mongodb.service.j2
    dest: "/etc/systemd/system/{{ mongodb_daemon_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - mongodb_manage_systemd_unit | bool
  notify:
    - MongoDB reload systemd
    - MongoDB restart

- name: Disable transparent huge pages
  ansible.builtin.include_tasks: disable_transparent_hugepages.yml
  when: mongodb_disable_transparent_hugepages | bool
