---
- name: Validate MongoDB settings
  ansible.builtin.import_tasks: validate.yml
  tags: [mongodb]

- name: Load platform variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', mongodb__platform_vars) }}"
  vars:
    mongodb__platform_vars:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths: ["{{ role_path }}/vars"]
  tags: [mongodb]

- name: Determine MongoDB release series
  ansible.builtin.set_fact:
    mongodb_major_version: "{{ mongodb_version.split('.')[:2] | join('.') }}"
  tags: [mongodb]

- name: Install MongoDB
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', mongodb__install_tasks) }}"
  vars:
    mongodb__install_tasks:
      files:
        - "install.{{ ansible_facts['distribution'] | lower }}.yml"
        - "install.{{ ansible_facts['os_family'] | lower }}.yml"
      paths: ["{{ role_path }}/tasks"]
  tags: [mongodb]

- name: Configure MongoDB
  ansible.builtin.import_tasks: configure.yml
  tags: [mongodb]

- name: Start and enable MongoDB
  ansible.builtin.service:
    name: "{{ mongodb_daemon_name }}"
    state: started
    enabled: true
  when: mongodb_manage_service | bool
  tags: [mongodb]

- name: Wait for MongoDB connections
  ansible.builtin.wait_for:
    host: "{{ mongodb_login_host }}"
    port: "{{ mongodb_login_port }}"
    timeout: 120
  when: mongodb_manage_service | bool and not ansible_check_mode
  tags: [mongodb]

- name: Build replica set membership
  ansible.builtin.include_tasks: replication_members.yml
  when:
    - mongodb_replication_replset | length > 0
    - mongodb_master | bool
  tags: [mongodb]

- name: Manage authentication and replication
  tags: [mongodb, mongodb_users]
  block:
    - name: Initialize authentication
      ansible.builtin.include_tasks: auth_initialization.yml
      when:
        - mongodb_security_authorization == 'enabled'
        - not mongodb_replication_replset or mongodb_master | bool
        - not ansible_check_mode

    - name: Configure replica set
      ansible.builtin.include_tasks: replication.yml
      when:
        - mongodb_replication_replset | length > 0
        - mongodb_master | bool
        - not ansible_check_mode

    - name: Manage requested users
      ansible.builtin.include_tasks: users.yml
      when:
        - not mongodb_replication_replset or mongodb_master | bool
        - not ansible_check_mode

- name: Install MongoDB exporter
  ansible.builtin.include_tasks: exporter.yml
  when: mongodb_exporter_install | bool
  tags: [mongodb, mongodb_exporter]

- name: Configure MMS agent
  ansible.builtin.include_tasks: mms-agent.yml
  when: mongodb_mms_api_key | length > 0
  tags: [mongodb]
