---
- name: Create MongoDB group
  ansible.builtin.group:
    name: "{{ mongodb_user }}"
    gid: "{{ mongodb_gid | default(omit, true) }}"
    system: true

- name: Create MongoDB service user
  ansible.builtin.user:
    name: "{{ mongodb_user }}"
    uid: "{{ mongodb_uid | default(omit, true) }}"
    group: "{{ mongodb_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Install replica set key
  ansible.builtin.copy:
    dest: "{{ mongodb_security_keyfile }}"
    content: "{{ mongodb_keyfile_content }}"
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_user }}"
    mode: "0600"
  when: mongodb_replication_replset | length > 0 and mongodb_security_authorization == 'enabled'
  no_log: true
  notify: MongoDB restart

- name: Create MongoDB directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mongodb_user }}"
    group: "{{ mongodb_user }}"
    mode: "0750"
  loop: "{{ [mongodb_storage_dbpath] + ([mongodb_systemlog_path | dirname] if mongodb_systemlog_destination == 'file' else []) }}"

- name: Configure MongoDB
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  notify: MongoDB restart

- name: Apply MongoDB configuration before managing users
  ansible.builtin.meta: flush_handlers
