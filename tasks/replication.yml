---
- name: Configure MongoDB replica set members
  community.mongodb.mongodb_replicaset:
    replica_set: "{{ mongodb_replication_replset }}"
    validate: false
    reconfigure: true
    members: "{{ mongodb__replica_members }}"
    login_user: "{{ mongodb_root_admin_name if mongodb_security_authorization == 'enabled' else omit }}"
    login_password: "{{ mongodb_root_admin_password if mongodb_security_authorization == 'enabled' else omit }}"
    login_host: "{{ mongodb_login_host }}"
    login_port: "{{ mongodb_login_port }}"
    ssl: "{{ mongodb_net_ssl_mode == 'requireSSL' }}"
    strict_compatibility: "{{ mongodb_strict_compatibility }}"
  no_log: true
