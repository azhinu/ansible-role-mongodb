---
- name: MongoDB refresh APT cache
  ansible.builtin.apt:
    update_cache: true

- name: MongoDB reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: MongoDB disable transparent hugepages
  ansible.builtin.systemd_service:
    name: disable-transparent-hugepages
    enabled: true
    state: started
    daemon_reload: true

- name: MongoDB restart
  ansible.builtin.service:
    name: "{{ mongodb_daemon_name }}"
    state: restarted
  when: mongodb_manage_service | bool
  notify: MongoDB wait for connections

- name: MongoDB restart MMS agent
  ansible.builtin.service:
    name: mongodb-mms-monitoring-agent
    state: restarted
  when: mongodb_manage_service | bool

- name: MongoDB wait for connections
  ansible.builtin.wait_for:
    host: "{{ mongodb_login_host }}"
    port: "{{ mongodb_login_port }}"
    timeout: 120
  when: mongodb_manage_service | bool and not ansible_check_mode

- name: MongoDB restart exporter
  ansible.builtin.systemd_service:
    name: mongodb_exporter.service
    daemon_reload: true
    state: restarted
